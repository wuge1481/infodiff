<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>每日信息差看板</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-logo">📡</span>
        <div class="brand-text">
          <h1>每日信息差看板</h1>
          <p id="updatedAt" class="updated">加载中…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <input id="search" class="search" type="search" placeholder="搜索当前板块…" autocomplete="off" />
        <button id="themeBtn" class="icon-btn" title="切换主题">🌓</button>
      </div>
    </div>
    <nav id="nav" class="nav" aria-label="板块导航"></nav>
  </header>

  <main id="main" class="main">
    <div id="loading" class="loading">🛰️ 正在加载数据…</div>
  </main>

  <footer class="footer">
    <p>信息聚合自公开信源, 每条均带原文链接, 可点击溯源核实。自动更新, 仅供参考。</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
