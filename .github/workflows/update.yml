name: 每日信息差看板 · 自动更新与部署

on:
  push:
    branches: [main]
  schedule:
    # UTC 时间: 23:30 / 04:30 / 11:00  →  北京时间 07:30 / 12:30 / 19:00
    - cron: "30 23,4,11 * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取数据
        run: node fetch.mjs
      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "数据无变化, 跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
